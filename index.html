<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal-Inspired Beauty Advisor</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <h1 class="site-title">Smart Product Advisor</h1>
      </header>
      <main>
        <section class="chatbox" aria-label="Beauty advisor chatbot">
          <div id="chatWindow" class="chat-window" role="log" aria-live="polite" aria-label="Chat messages"></div>
          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input id="userInput" name="userInput" type="text" maxlength="2000" placeholder="Ask me about products or routines…" autocomplete="off" required />
            <button type="submit" id="sendBtn" aria-label="Send message">
              <span class="material-icons" aria-hidden="true">send</span>
            </button>
          </form>
        </section>
      </main>
      <footer class="site-footer">
        <p>Student demo; not affiliated with or endorsed by L'Oréal.</p>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
